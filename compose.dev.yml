services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rave
      POSTGRES_PASSWORD: rave
      POSTGRES_DB: rave
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rave -d rave"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
